    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: 12px;
        }

        .container { max-width: 480px; margin: 0 auto; }

        .header {
            text-align: center;
            padding: 12px 15px 8px;
            background: linear-gradient(135deg, #00549F, #00ADD0);
            border-radius: 12px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            margin-bottom: 10px;
        }

        .logo { width: 140px; margin-bottom: 6px; }
        .header h1 { font-size: 1.1rem; color: #00d4ff; margin-bottom: 2px; text-transform: uppercase; }
        .header p { font-size: 0.8rem; opacity: 0.8; }
        .version { font-size: 0.65rem; opacity: 0.35; margin-top: 4px; }

        .form-container {
            background: rgba(255,255,255,0.08);
            padding: 15px;
            border-radius: 12px;
            border: 2px solid rgba(0, 212, 255, 0.3);
        }

        .form-group { margin-bottom: 12px; }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #00ff88;
            font-weight: bold;
            font-size: 0.82rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 11px 13px;
            font-size: 16px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: white;
            transition: all 0.3s;
            font-family: Arial, sans-serif;
        }

        .form-group textarea { resize: none; height: 60px; font-size: 14px; }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        .form-group input::placeholder, .form-group textarea::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            font-size: 1.05rem;
            font-weight: bold;
            color: #1a1a2e;
            background: linear-gradient(135deg, #00ff88, #00d4aa);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 4px;
        }

        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            border-radius: 10px;
            margin-top: 12px;
        }

        .success-message.active { display: block; animation: slideIn 0.4s; }
        .success-message h2 { color: #00ff88; font-size: 1.4rem; margin-bottom: 8px; }
        .success-message p { font-size: 0.9rem; opacity: 0.9; }

        .error-message {
            display: none;
            text-align: center;
            padding: 12px;
            background: rgba(255, 51, 102, 0.2);
            border: 2px solid #ff3366;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .error-message.active { display: block; animation: slideIn 0.4s; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

            <h1>Vos, colocás fuelle en segundos?</h1>
            <p>Registrate para participar</p>
            <div class="version">v2.73</div>
        </div>

        <div class="form-container">
            <form id="registrationForm">
                <div class="form-group">
                    <label for="nombre_competidor">Nombre *</label>
                    <input type="text" id="nombre_competidor" name="nombre_competidor" placeholder="Juan Pérez" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="celular">Celular *</label>
                    <input type="tel" id="celular" name="celular" placeholder="1112345678" pattern="[0-9]{8,12}" inputmode="numeric" required>
                </div>

                <div class="form-group">
                    <label for="nombre_negocio">Negocio / Taller</label>
                    <input type="text" id="nombre_negocio" name="nombre_negocio" placeholder="Opcional" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="comentario">Comentario</label>
                    <textarea id="comentario" name="comentario" placeholder="Opcional"></textarea>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">🏁 Registrarme</button>
            </form>

            <div class="success-message" id="successMessage">
                <h2>✅ ¡Registrado!</h2>
                <p>Ya estás en la cola para competir</p>
                <p style="margin-top:6px; opacity:0.7;">Acercate al stand cuando te llamen</p>
            </div>

            <div class="error-message" id="errorMessage">
                <span id="errorText">⚠️ Hubo un problema. Intentá de nuevo.</span>
            </div>
        </div>
    </div>

    <iframe id="hiddenFrame" name="hiddenFrame" style="display:none;"></iframe>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQIcbPWDwUg3Bz_JTYVmqiVjPGzcjVM0MPaRTbsJqm7u1zILXzcfeIyiu-f3JT_y2p/exec';

        let dispositivoId = localStorage.getItem('griffo_dispositivo_id');
        let operadorNombre = localStorage.getItem('griffo_operador_nombre');

        if (!dispositivoId) {
            dispositivoId = 'CEL_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6).toUpperCase();
            localStorage.setItem('griffo_dispositivo_id', dispositivoId);
        }

        if (!operadorNombre || operadorNombre === 'Anónimo' || operadorNombre === 'Anonimo') {
            operadorNombre = prompt('👤 ¿Cuál es TU nombre?\n(Solo se pregunta una vez por celular)');
            operadorNombre = (operadorNombre && operadorNombre.trim()) ? operadorNombre.trim() : 'Anónimo';
            localStorage.setItem('griffo_operador_nombre', operadorNombre);
        }

        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nombre_competidor = document.getElementById('nombre_competidor').value.trim();
            const celular = document.getElementById('celular').value.trim();
            const nombre_negocio = document.getElementById('nombre_negocio').value.trim();
            const comentario = document.getElementById('comentario').value.trim();

            if (!/^\d{8,12}$/.test(celular)) {
                document.getElementById('errorText').textContent = '⚠️ El celular debe tener entre 8 y 12 dígitos (solo números)';
                document.getElementById('errorMessage').classList.add('active');
                setTimeout(() => document.getElementById('errorMessage').classList.remove('active'), 3000);
                return;
            }

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.textContent = '⏳ Verificando...';

            // Verificar si el celular ya está registrado hoy
            try {
                const res = await fetch(`${SCRIPT_URL}?action=verificar&celular=${encodeURIComponent(celular)}`);
                const data = await res.json();
                if (data.duplicado) {
                    document.getElementById('errorText').textContent = '🚫 Este celular ya está registrado hoy';
                    document.getElementById('errorMessage').classList.add('active');
                    setTimeout(() => document.getElementById('errorMessage').classList.remove('active'), 4000);
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = '🏁 Registrarme';
                    return;
                }
            } catch(err) {
                // Si falla la verificación, continúa igual (el Script igual controla duplicados)
                console.warn('No se pudo verificar duplicado:', err);
            }

            btnSubmit.textContent = '⏳ Enviando...';

            const tempForm = document.createElement('form');
            tempForm.action = SCRIPT_URL;
            tempForm.method = 'POST';
            tempForm.target = 'hiddenFrame';
            tempForm.style.display = 'none';

            const fields = {
                nombre_competidor: nombre_competidor,
                celular: celular,
                nombre_negocio: nombre_negocio,
                comentario: comentario,
                tiempo: '',
                estado: 'registrado',
                operador: operadorNombre,
                dispositivo_id: dispositivoId
            };

            for (const [key, value] of Object.entries(fields)) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = value;
                tempForm.appendChild(input);
            }

            document.body.appendChild(tempForm);
            tempForm.submit();
            setTimeout(() => { if (document.body.contains(tempForm)) document.body.removeChild(tempForm); }, 1000);

            document.getElementById('registrationForm').style.display = 'none';
            document.getElementById('successMessage').classList.add('active');

            setTimeout(() => {
                document.getElementById('registrationForm').reset();
                document.getElementById('registrationForm').style.display = 'block';
                document.getElementById('successMessage').classList.remove('active');
                btnSubmit.disabled = false;
                btnSubmit.textContent = '🏁 Registrarme';
            }, 3000);
        });
    </script>
</body>
</html>
